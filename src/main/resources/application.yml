spring:
  application:
    name: ai-knowledge-assistant
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  rag:
    chunk-size: 800
    chunk-overlap: 120
    default-top-k: 4
    max-top-k: 20
    embedding-dimensions: 256
    min-score: 0.05

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:knowledge;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowledge}
    username: ${SPRING_DATASOURCE_USERNAME:knowledge}
    password: ${SPRING_DATASOURCE_PASSWORD:knowledge}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
