<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Knowledge Assistant</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-2: #273449;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-2: #818cf8;
            --border: #334155;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top left, #1e3a5f 0%, var(--bg) 45%);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            max-width: 1040px;
            margin: 0 auto;
            padding: 40px 20px 12px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle { color: var(--muted); margin: 0; }

        main {
            max-width: 1040px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }

        .card h2 { margin: 0 0 14px; font-size: 1.1rem; }

        .card.wide { grid-column: 1 / -1; }

        label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 6px; }

        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            font: inherit;
        }

        textarea { resize: vertical; min-height: 120px; }

        button {
            margin-top: 12px;
            padding: 10px 18px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            color: #06121f;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled { opacity: .55; cursor: progress; }

        button.ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            font-weight: 500;
            padding: 4px 10px;
            margin: 0;
        }

        .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }

        .doc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

        .doc {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel-2);
        }

        .doc strong { display: block; font-size: .95rem; }

        .meta { color: var(--muted); font-size: .78rem; margin-top: 4px; }

        .answer {
            margin-top: 16px;
            padding: 16px;
            border-left: 3px solid var(--accent);
            background: var(--panel-2);
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
            display: none;
        }

        .sources { margin-top: 12px; display: none; }

        .source {
            padding: 10px 12px;
            border: 1px dashed var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: .85rem;
            color: var(--muted);
        }

        .source b { color: var(--text); }

        .error { color: #fda4af; margin-top: 10px; font-size: .85rem; display: none; }

        footer {
            max-width: 1040px;
            margin: 0 auto;
            padding: 10px 20px 40px;
            color: var(--muted);
            font-size: .78rem;
        }
    </style>
</head>
<body>
<header>
    <h1>AI Knowledge Assistant</h1>
    <p class="subtitle">Upload your notes, then ask questions answered only from those documents.</p>
</header>

<main>
    <section class="card">
        <h2>Add a document</h2>
        <form id="textForm">
            <label for="title">Title</label>
            <input id="title" type="text" placeholder="Spring Boot notes" required maxlength="200">
            <label for="content">Text</label>
            <textarea id="content" placeholder="Paste the text you want to make searchable..." required></textarea>
            <button type="submit">Save and embed</button>
        </form>
        <div class="error" id="textError"></div>
    </section>

    <section class="card">
        <h2>Upload a file</h2>
        <form id="fileForm">
            <label for="file">Plain text or Markdown (.txt, .md)</label>
            <input id="file" type="file" accept=".txt,.md,.markdown" required>
            <label for="fileTitle">Title (optional)</label>
            <input id="fileTitle" type="text" placeholder="Defaults to the file name" maxlength="200">
            <button type="submit">Upload</button>
        </form>
        <div class="error" id="fileError"></div>
    </section>

    <section class="card wide">
        <div class="row">
            <h2>Knowledge base</h2>
            <span class="meta" id="docCount"></span>
        </div>
        <ul class="doc-list" id="docList">
            <li class="meta">No documents yet.</li>
        </ul>
    </section>

    <section class="card wide">
        <h2>Ask a question</h2>
        <form id="askForm">
            <label for="question">Question</label>
            <textarea id="question" placeholder="What does the document say about...?" required
                      style="min-height: 80px;"></textarea>
            <button type="submit">Ask</button>
        </form>
        <div class="error" id="askError"></div>
        <div class="answer" id="answer"></div>
        <div class="sources" id="sources"></div>
    </section>
</main>

<footer>
    Embedding model: <span th:text="${embeddingModel}">local</span> &middot;
    Answers are grounded in the retrieved passages shown below each response.
</footer>

<script>
    const docList = document.getElementById('docList');
    const docCount = document.getElementById('docCount');

    async function request(url, options) {
        const response = await fetch(url, options);
        if (response.status === 204) {
            return null;
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            throw new Error(data.message || ('Request failed with status ' + response.status));
        }
        return data;
    }

    function showError(elementId, message) {
        const element = document.getElementById(elementId);
        element.textContent = message;
        element.style.display = message ? 'block' : 'none';
    }

    async function loadDocuments() {
        try {
            const documents = await request('/api/documents');
            docCount.textContent = documents.length + (documents.length === 1 ? ' document' : ' documents');
            docList.innerHTML = '';
            if (documents.length === 0) {
                const empty = document.createElement('li');
                empty.className = 'meta';
                empty.textContent = 'No documents yet.';
                docList.appendChild(empty);
                return;
            }
            for (const doc of documents) {
                const item = document.createElement('li');
                item.className = 'doc';

                const info = document.createElement('div');
                const title = document.createElement('strong');
                title.textContent = doc.title;
                const meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = doc.chunkCount + ' chunks'
                    + (doc.sourceName ? ' · ' + doc.sourceName : '')
                    + ' · ' + new Date(doc.createdAt).toLocaleString();
                info.append(title, meta);

                const remove = document.createElement('button');
                remove.className = 'ghost';
                remove.textContent = 'Delete';
                remove.addEventListener('click', async () => {
                    await request('/api/documents/' + doc.id, {method: 'DELETE'});
                    loadDocuments();
                });

                item.append(info, remove);
                docList.appendChild(item);
            }
        } catch (error) {
            showError('textError', error.message);
        }
    }

    document.getElementById('textForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        showError('textError', '');
        const button = event.target.querySelector('button');
        button.disabled = true;
        try {
            await request('/api/documents', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    title: document.getElementById('title').value,
                    content: document.getElementById('content').value
                })
            });
            event.target.reset();
            loadDocuments();
        } catch (error) {
            showError('textError', error.message);
        } finally {
            button.disabled = false;
        }
    });

    document.getElementById('fileForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        showError('fileError', '');
        const button = event.target.querySelector('button');
        button.disabled = true;
        try {
            const data = new FormData();
            data.append('file', document.getElementById('file').files[0]);
            const title = document.getElementById('fileTitle').value.trim();
            if (title) {
                data.append('title', title);
            }
            await request('/api/documents/upload', {method: 'POST', body: data});
            event.target.reset();
            loadDocuments();
        } catch (error) {
            showError('fileError', error.message);
        } finally {
            button.disabled = false;
        }
    });

    document.getElementById('askForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        showError('askError', '');
        const button = event.target.querySelector('button');
        button.disabled = true;
        const answerBox = document.getElementById('answer');
        const sourcesBox = document.getElementById('sources');
        answerBox.style.display = 'none';
        sourcesBox.style.display = 'none';
        try {
            const result = await request('/api/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question: document.getElementById('question').value})
            });
            answerBox.textContent = result.answer + '\n\n(' + result.model
                + ' · ' + result.latencyMs + ' ms)';
            answerBox.style.display = 'block';

            sourcesBox.innerHTML = '';
            for (const source of result.sources) {
                const item = document.createElement('div');
                item.className = 'source';
                const heading = document.createElement('b');
                heading.textContent = source.documentTitle + ' · chunk ' + (source.chunkIndex + 1)
                    + ' · score ' + source.score;
                const text = document.createElement('div');
                text.textContent = source.snippet;
                item.append(heading, text);
                sourcesBox.appendChild(item);
            }
            sourcesBox.style.display = result.sources.length ? 'block' : 'none';
        } catch (error) {
            showError('askError', error.message);
        } finally {
            button.disabled = false;
        }
    });

    loadDocuments();
</script>
</body>
</html>
