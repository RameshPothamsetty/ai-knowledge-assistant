name: Bug report
description: Something behaves differently from the documentation
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste secrets or private documents.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The actual behaviour, including the HTTP status and response body if this is an API call.
      placeholder: |
        POST /api/ask returned 400 with {"message":"validation failed"...}
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. mvn spring-boot:run
        2. POST /api/documents with ...
        3. POST /api/ask with ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingestion / chunking
        - Retrieval / scoring
        - Answer generation
        - REST API
        - Web UI
        - Build / CI / Docker
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit SHA, JDK, Node and OS version.
      placeholder: 372df84, JDK 21.0.5, Node 22.11, Windows 11
